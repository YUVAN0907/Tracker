# ==============================
# BASE TABLES
# ==============================

type Vendor @table(key: "vendorId") {
  vendorId: String!
  vendorName: String
  address: String
  mobileNumber: String
  secondaryNumber: String
  email: String
  gstNo: String
}

type Product @table(key: "productId") {
  productId: String!
  productName: String
  aliasName: String
  category: String

  vendorId: String!
  mrp: Float
  quantity: String
  units: Int
  gst: Float
  eanNo: String
  selfLife: Int

  unitCost: Float
  landedCost: Float

  vendor: Vendor! @ref(fields: "vendorId") 
}

type Machine @table(key: "machineId") {
  machineId: String!
  location: String
  status: String
  latitude: Float
  longitude: Float
}

# ==============================
# PURCHASE TABLES
# ==============================
type PurchaseOrderHeader @table(key: "poId") {
  poId: String!
  vendorId: String!

  createdDate: Timestamp
  totalAmount: Float
  status: String
  rejectionReason: String
  createdBy: String

  vendor: Vendor! @ref(fields: "vendorId")
}

type PurchaseOrderLine @table(key: "lineId") {
  lineId: String!
  poId: String!
  productId: String!
  noOfCases: Int
  unitsPerCase: Int
  poPrice: Float
  lineTotal: Float

  purchaseOrderHeader: PurchaseOrderHeader! @ref(fields: "poId")
  product: Product! @ref(fields: "productId")
}

# ==============================
# NORMALIZED VENDOR PURCHASE (1NF)
# ==============================

# LEVEL 1: Vendor Purchase Order Header (PO-Level Payment Data)
type VendorPurchaseOrder @table(key: "purchaseOrderId") {
  purchaseOrderId: UUID! @default(expr: "uuidV4()")

  # Foreign Keys
  poId: String!
  vendorId: String!

  # PO-Level Fields (Stored Once per PO)
  receivedDate: Timestamp!
  paymentMode: String!
  paymentStatus: String!
  gstFiled: Boolean! @default(value: false)

  # Relations
  purchaseOrderHeader: PurchaseOrderHeader! @ref(fields: "poId")
  vendor: Vendor! @ref(fields: "vendorId")
}

# LEVEL 2: Vendor Purchase Item (Product-Level Line Items)
type VendorPurchaseItem @table(key: "itemId") {
  itemId: UUID! @default(expr: "uuidV4()")

  # Foreign Key
  purchaseOrderId: UUID!
  productId: String!

  # Product-Specific Fields (Stored Once per Product per PO)
  batch: Int!
  unitsPerCase: Int!
  caseCount: Int!
  totalUnits: Int!
  mrp: Float!
  poPrice: Float!

  # Relations
  vendorPurchaseOrder: VendorPurchaseOrder! @ref(fields: "purchaseOrderId")
  product: Product! @ref(fields: "productId")
}

# ==============================
# WAREHOUSE MODEL
# ==============================

# A physical warehouse location with name and location metadata
# Each warehouse can hold multiple product cases from deliveries.
type Warehouse @table(key: "warehouseId") {
  warehouseId: String!
  name: String!
  location: String
  address: String
  notes: String
  createdAt: Timestamp
  updatedAt: Timestamp
}

# Warehouse stock records store product case-level inventory in a specific warehouse.
type WarehouseStock @table(key: "stockId") {
  stockId: UUID! @default(expr: "uuidV4()")
  warehouseId: String!
  poId: String
  productId: String!
  batch: Int
  unitsPerCase: Int
  caseLabel: String
  availableUnits: Int!
  mfd: Timestamp
  expd: Timestamp
  receivedDate: Timestamp
  notes: String
  createdAt: Timestamp
  updatedAt: Timestamp

  warehouse: Warehouse! @ref(fields: "warehouseId")
  product: Product! @ref(fields: "productId")
}

# ==============================
# MACHINE STOCK TABLES
# ==============================

type MachineInventory @table(key: "machineInventoryId") {
  machineInventoryId: String!
  machineId: String!
  productId: String!
  currentStock: Int

  machine: Machine! @ref(fields: "machineId")
  product: Product! @ref(fields: "productId")
}

# ==============================
# NORMALIZED BATCH ASSIGNMENT (3NF)
# ==============================

# LEVEL 1: Batch-level information (one record per batch)
type BatchAssignment @table(key: "batch") {
  batch: Int!
  assignedDate: Timestamp!
  status: String                 # "Active", "Inactive", "Completed"
}

# LEVEL 2: Stock-Cover combinations (one record per stock-cover per machine)
type StockCoverAssignment @table(key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  batch: Int!
  machineId: String!
  stockLabel: String!
  coverLabel: String!
  coverStatus: String            # "covered", "uncovered", "open", "sealed"

  # Foreign key relationships
  batchAssignment: BatchAssignment! @ref(fields: "batch")
  machine: Machine! @ref(fields: "machineId")

  # Uniqueness constraint: one stock-cover per machine per batch
  # UNIQUE(batch, machineId, stockLabel, coverLabel)
}

# LEVEL 3: Products assigned to stock-covers (many products per stock-cover)
type StockCoverProductAssignment @table(key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  stockCoverAssignmentId: UUID!
  productId: String!
  units: Int
  caseLabel: String              # Case label to track specific case with expiry date

  # Foreign key relationships
  stockCoverAssignment: StockCoverAssignment! @ref(fields: "stockCoverAssignmentId")
  product: Product! @ref(fields: "productId")

  # Uniqueness constraint: one product per stock-cover
  # UNIQUE(stockCoverAssignmentId, productId)
}

# ==============================
# SALES & OPERATIONS
# ==============================

enum SaleStatus {
  SUCCESS
  PAYMENT_FAILED
  DISPENSE_FAILED
  PAY_SERVICE_DOWN
  SESSION_EXPIRED
}

type Sale @table(key: "saleId") {
  saleId: UUID! @default(expr: "uuidV4()")

  machineId: String!
  slot: String
  productId: String!

  quantitySold: Int
  mrp: Float

  status: SaleStatus!

  transactionAt: Timestamp

  machine: Machine! @ref(fields: "machineId")
  product: Product! @ref(fields: "productId")
}

type RefillLog @table(key: "refillId") {
  refillId: UUID! @default(expr: "uuidV4()")

  date: Timestamp
  refillerId: String
  machineId: String!
  productId: String!
  coverCount: Int
  quantity: Int

  machine: Machine! @ref(fields: "machineId")
  product: Product! @ref(fields: "productId")
}

# ==============================
# AUTHENTICATION & USER MANAGEMENT
# ==============================

type UserRole @table(key: "roleId") {
  roleId: String!
  roleName: String!      # "admin" or "user"
  permissions: [String]  # Array of permissions
  description: String
}

type User @table(key: "userId") {
  userId: String!
  email: String!         # Unique email
  fullName: String
  passwordHash: String!  # bcrypt hashed password
  role: String!          # "admin" or "user"
  status: String!        # "active" or "inactive"
  permissions: String    # JSON array of granted feature permissions
  createdAt: Timestamp!
  createdBy: String      # Admin who created this user (userId)
  lastLogin: Timestamp
  updatedAt: Timestamp!
}

type AuditLog @table(key: "logId") {
  logId: String!
  userId: String!        # Who performed the action
  action: String!        # LOGIN, LOGOUT, CREATE_USER, UPDATE_USER, DELETE_USER, CHANGE_PASSWORD, etc.
  resourceType: String   # "user", "product", "order", etc.
  resourceId: String     # ID of the resource affected
  details: String        # JSON details of the action
  timestamp: Timestamp!
  ipAddress: String
}

# ==============================
# BILL HISTORY & INVOICING
# ==============================

type BillHistory @table(key: "billId") {
  billId: String!
  userId: String!                # User who generated the bill
  billNumber: String!            # Invoice/Bill number
  billDate: Timestamp!
  totalAmount: Float!            # Total amount of bill
  totalProducts: Int!            # Total number of products in bill
  totalItems: Int!               # Total quantity of items
  billData: String               # JSON data of bill (serialized)
  downloadedAt: Timestamp        # When bill was downloaded
  downloadCount: Int! @default(value: 0)
  status: String! @default(value: "generated")  # generated, downloaded, archived
  notes: String
  
  # Metadata
  createdAt: Timestamp!
  updatedAt: Timestamp!
  
  # Optional relation to user
  user: User! @ref(fields: "userId")
}

# ==============================
# QR CODE GENERATION HISTORY
# ==============================

type QrCodeHistory @table(key: "qrId") {
  qrId: UUID! @default(expr: "uuidV4()")
  batchDateKey: String! @unique  # Unique identifier for QR set, based on batch number + assigned date
  machineIds: [String!]!         # Array of machine IDs for which QR codes were generated
  qrData: String!                # JSON data containing QR code information (machine details, URLs, etc.)
  pdfGenerated: Boolean! @default(value: false)
  pdfDownloadCount: Int! @default(value: 0)
  lastDownloadedAt: Timestamp
  notes: String
  
  # Metadata
  createdAt: Timestamp!
  updatedAt: Timestamp!
}

# ==============================
# RECENT PRODUCTS TRACKING
# ==============================
type RecentProduct @table(key: "recentProductId") {
  recentProductId: UUID! @default(expr: "uuidV4()")
  
  # Product Details (same as Product Master)
  productId: String! # Unique product identifier
  productName: String!
  category: String
  vendorId: String
  
  unitCost: Float      # PO/Landed cost
  mrp: Float          # Market/Retail Price
  quantity: String    # Description/quantity format
  units: Int          # Units per case
  gst: Float          # GST rate
  eanNo: String       # EAN barcode
  selfLife: Int       # Self life in months
  
  # Tracking Fields
  unitsPurchased: Int! @default(value: 0)   # Auto-incremented on delivery
  unitsSold: Int! @default(value: 0)        # Auto-incremented on batch assignment
  rate: Float! @default(value: 0)           # Calculated: (unitsSold / unitsPurchased) * 100
  
  # Metadata
  createdAt: Timestamp!
  updatedAt: Timestamp!
  
  # Optional relation to vendor
  vendor: Vendor @ref(fields: "vendorId")
}