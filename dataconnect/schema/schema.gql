# ==============================
# BASE TABLES
# ==============================

type Vendor @table(key: "vendorId") {
  vendorId: String!
  vendorName: String
  address: String
  mobileNumber: String
  secondaryNumber: String
  email: String
  gstNo: String
}

type Product @table(key: "productId") {
  productId: String!
  productName: String
  category: String

  vendorId: String!
  mrp: Float
  quantity: String
  units: Int
  gst: Float
  eanNo: String
  selfLife: Int

  unitCost: Float
  landedCost: Float

  vendor: Vendor! @ref(fields: "vendorId") 
}

type Machine @table(key: "machineId") {
  machineId: String!
  location: String
  status: String
}

# ==============================
# PURCHASE TABLES
# ==============================
type PurchaseOrderHeader @table(key: "poId") {
  poId: String!
  vendorId: String!

  createdDate: Timestamp
  totalAmount: Float
  status: String

  vendor: Vendor! @ref(fields: "vendorId")
}

type PurchaseOrderLine @table(key: "lineId") {
  lineId: String!
  poId: String!
  productId: String!
  noOfCases: Int
  unitsPerCase: Int
  poPrice: Float
  lineTotal: Float

  purchaseOrderHeader: PurchaseOrderHeader! @ref(fields: "poId")
  product: Product! @ref(fields: "productId")
}

# ==============================
# NORMALIZED VENDOR PURCHASE (1NF)
# ==============================

# LEVEL 1: Vendor Purchase Order Header (PO-Level Payment Data)
type VendorPurchaseOrder @table(key: "purchaseOrderId") {
  purchaseOrderId: UUID! @default(expr: "uuidV4()")

  # Foreign Keys
  poId: String!
  vendorId: String!

  # PO-Level Fields (Stored Once per PO)
  receivedDate: Timestamp!
  paymentMode: String!
  paymentStatus: String!
  gstFiled: Boolean! @default(value: false)

  # Relations
  purchaseOrderHeader: PurchaseOrderHeader! @ref(fields: "poId")
  vendor: Vendor! @ref(fields: "vendorId")
}

# LEVEL 2: Vendor Purchase Item (Product-Level Line Items)
type VendorPurchaseItem @table(key: "itemId") {
  itemId: UUID! @default(expr: "uuidV4()")

  # Foreign Key
  purchaseOrderId: UUID!
  productId: String!

  # Product-Specific Fields (Stored Once per Product per PO)
  batch: Int!
  unitsPerCase: Int!
  caseCount: Int!
  totalUnits: Int!
  mrp: Float!
  poPrice: Float!

  # Relations
  vendorPurchaseOrder: VendorPurchaseOrder! @ref(fields: "purchaseOrderId")
  product: Product! @ref(fields: "productId")
}

# ==============================
# NORMALIZED PURCHASED PRODUCTS (3NF)
# ==============================

# LEVEL 1: PO + Product Delivery (Common per product per PO)
type PurchasedProductBatch @table(key: "id") {
  id: UUID! @default(expr: "uuidV4()")

  # Foreign Keys
  poId: String!
  productId: String!

  # Common fields for this product in this PO
  batch: Int!              # Batch number (1, 2, 3...)
  unitsPerCase: Int!       # Standard units per case for this product in this PO
  totalUnitsReceived: Int! # Total units received for this product in this PO (sum of all cases)
  receivedDate: Timestamp  # When this product batch was received (PO level data)
  notes: String            # Notes common to all cases of this product in this PO

  # Metadata
  status: String           # active, closed, partial
  createdAt: Timestamp
  updatedAt: Timestamp

  # Relations
  purchaseOrderHeader: PurchaseOrderHeader! @ref(fields: "poId")
  product: Product! @ref(fields: "productId")
}

# LEVEL 2: Individual Cases (Case-specific data)
type PurchasedProductCase @table(key: "id") {
  id: UUID! @default(expr: "uuidV4()")

  # Foreign Key to batch
  purchasedProductBatchId: UUID!

  # Auto-generated case label (poId_productId_c1, c2, c3...)
  caseLabel: String!       # Unique identifier: e.g., "PO123_PROD456_c1"


  # Case-specific dates
  mfd: Timestamp!          # Manufacture Date
  expd: Timestamp!         # Expiry Date

  # Case inventory
  availableUnits: Int!     # Current available units in this case

  # Metadata
  lastUpdated: Timestamp

  # Relations
  purchasedProductBatch: PurchasedProductBatch! @ref(fields: "purchasedProductBatchId")
}

# ==============================
# WAREHOUSE MODEL
# ==============================

# A physical warehouse location with name and location metadata
# Each warehouse can hold multiple product cases from deliveries.
type Warehouse @table(key: "warehouseId") {
  warehouseId: String!
  name: String!
  location: String
  address: String
  notes: String
  createdAt: Timestamp
  updatedAt: Timestamp
}

# Warehouse stock records store product case-level inventory in a specific warehouse.
type WarehouseStock @table(key: "stockId") {
  stockId: UUID! @default(expr: "uuidV4()")
  warehouseId: String!
  poId: String
  productId: String!
  batch: Int
  unitsPerCase: Int
  caseLabel: String
  availableUnits: Int!
  mfd: Timestamp
  expd: Timestamp
  receivedDate: Timestamp
  notes: String
  createdAt: Timestamp
  updatedAt: Timestamp

  warehouse: Warehouse! @ref(fields: "warehouseId")
  product: Product! @ref(fields: "productId")
}

# ==============================
# MACHINE STOCK TABLES
# ==============================

type MachineInventory @table(key: "machineInventoryId") {
  machineInventoryId: String!
  machineId: String!
  productId: String!
  currentStock: Int

  machine: Machine! @ref(fields: "machineId")
  product: Product! @ref(fields: "productId")
}

type MachineStockAssignment @table(key: "id") {
  id: UUID! @default(expr: "uuidV4()")

  batch: Int
  assignedDate: Timestamp

  machineId: String!
  stockLabel: String!
  caseLabel: String          # Case label to track specific case with expiry date
  coverLabel: String!

  coverStatus: String

  productId: String!
  units: Int

  status: String

  machine: Machine! @ref(fields: "machineId")
  product: Product! @ref(fields: "productId")
}

# ==============================
# SALES & OPERATIONS
# ==============================

enum SaleStatus {
  SUCCESS
  PAYMENT_FAILED
  DISPENSE_FAILED
  PAY_SERVICE_DOWN
  SESSION_EXPIRED
}

type Sale @table(key: "saleId") {
  saleId: UUID! @default(expr: "uuidV4()")

  machineId: String!
  slot: String
  productId: String!

  quantitySold: Int
  mrp: Float

  status: SaleStatus!

  transactionAt: Timestamp

  machine: Machine! @ref(fields: "machineId")
  product: Product! @ref(fields: "productId")
}

type RefillLog @table(key: "refillId") {
  refillId: UUID! @default(expr: "uuidV4()")

  date: Timestamp
  refillerId: String
  machineId: String!
  productId: String!
  coverCount: Int
  quantity: Int

  machine: Machine! @ref(fields: "machineId")
  product: Product! @ref(fields: "productId")
}

# ==============================
# AUTHENTICATION & USER MANAGEMENT
# ==============================

type UserRole @table(key: "roleId") {
  roleId: String!
  roleName: String!      # "admin" or "user"
  permissions: [String]  # Array of permissions
  description: String
}

type User @table(key: "userId") {
  userId: String!
  email: String!         # Unique email
  fullName: String
  passwordHash: String!  # bcrypt hashed password
  role: String!          # "admin" or "user"
  status: String!        # "active" or "inactive"
  createdAt: Timestamp!
  createdBy: String      # Admin who created this user (userId)
  lastLogin: Timestamp
  updatedAt: Timestamp!
}

type AuditLog @table(key: "logId") {
  logId: String!
  userId: String!        # Who performed the action
  action: String!        # LOGIN, LOGOUT, CREATE_USER, UPDATE_USER, DELETE_USER, CHANGE_PASSWORD, etc.
  resourceType: String   # "user", "product", "order", etc.
  resourceId: String     # ID of the resource affected
  details: String        # JSON details of the action
  timestamp: Timestamp!
  ipAddress: String
}

# ==============================
# BILL HISTORY & INVOICING
# ==============================

type BillHistory @table(key: "billId") {
  billId: String!
  userId: String!                # User who generated the bill
  billNumber: String!            # Invoice/Bill number
  billDate: Timestamp!
  totalAmount: Float!            # Total amount of bill
  totalProducts: Int!            # Total number of products in bill
  totalItems: Int!               # Total quantity of items
  billData: String               # JSON data of bill (serialized)
  downloadedAt: Timestamp        # When bill was downloaded
  downloadCount: Int! @default(value: 0)
  status: String! @default(value: "generated")  # generated, downloaded, archived
  notes: String
  
  # Metadata
  createdAt: Timestamp!
  updatedAt: Timestamp!
  
  # Optional relation to user
  user: User! @ref(fields: "userId")
}